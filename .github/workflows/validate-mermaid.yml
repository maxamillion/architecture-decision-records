name: Validate Mermaid Diagrams

on:
  pull_request:
    paths:
      - 'mermaid-diagrams/**/*.md'
      - '.github/workflows/validate-mermaid.yml'
      - 'scripts/validate-mermaid.sh'
  push:
    branches:
      - main
      - master
    paths:
      - 'mermaid-diagrams/**/*.md'
      - '.github/workflows/validate-mermaid.yml'
      - 'scripts/validate-mermaid.sh'
  workflow_dispatch:

jobs:
  validate-mermaid-syntax:
    name: Validate Mermaid Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '.github/package-lock.json'

      - name: Cache Mermaid CLI
        id: cache-mermaid
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-mermaid-cli-${{ hashFiles('.github/workflows/validate-mermaid.yml') }}
          restore-keys: |
            ${{ runner.os }}-mermaid-cli-

      - name: Install Mermaid CLI
        run: |
          npm install -g @mermaid-js/mermaid-cli
          mmdc --version

      - name: Make validation script executable
        run: chmod +x scripts/validate-mermaid.sh

      - name: Validate Mermaid diagrams
        id: validate
        run: |
          ./scripts/validate-mermaid.sh
        continue-on-error: true

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: mermaid-validation-report
          path: |
            mermaid-validation-report.md
            mermaid-validation-errors.log
          retention-days: 30

      - name: Comment on PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let reportContent = '';
            try {
              reportContent = fs.readFileSync('mermaid-validation-report.md', 'utf8');
            } catch (error) {
              reportContent = '⚠️ Unable to read validation report';
            }

            const comment = `## Mermaid Diagram Validation Report

            ${reportContent}

            <details>
            <summary>View validation details</summary>

            Download the full validation report from the workflow artifacts for detailed error messages.

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if validation errors found
        if: steps.validate.outcome == 'failure'
        run: |
          echo "❌ Mermaid validation failed. Please fix the errors and try again."
          exit 1

      - name: Success message
        if: steps.validate.outcome == 'success'
        run: |
          echo "✅ All Mermaid diagrams are valid!"
